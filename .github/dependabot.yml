version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - javascript
    groups:
      # Minor and patch updates in one PR; majors get their own.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The WordPress test suite supports PHPUnit up to 9.
      - dependency-name: phpunit/phpunit
        update-types:
          - version-update:semver-major
      # WPCS doesn't support PHPCS 4 yet.
      - dependency-name: squizlabs/php_codesniffer
        update-types:
          - version-update:semver-major
