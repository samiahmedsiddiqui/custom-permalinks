name: Coding Standards

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Runs the PHP coding standards checks and static analysis.
  phpcs:
    name: PHP coding standards
    uses: ./.github/workflows/reusable-coding-standards-php.yml
    permissions:
      contents: read
    if: ${{ github.repository == 'samiahmedsiddiqui/custom-permalinks' || github.event_name == 'pull_request' }}

  # Runs the JavaScript and CSS coding standards checks and the build check.
  eslint:
    name: JavaScript and CSS coding standards
    uses: ./.github/workflows/reusable-coding-standards-javascript.yml
    permissions:
      contents: read
    if: ${{ github.repository == 'samiahmedsiddiqui/custom-permalinks' || github.event_name == 'pull_request' }}

