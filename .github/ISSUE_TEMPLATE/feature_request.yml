name: Feature request
description: Suggest an improvement or a new feature.
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case behind the request.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Custom Permalinks to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
