name: Bug report
description: Report something in Custom Permalinks that doesn't work as expected.
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For questions or help setting up the plugin, please use the [support forum](https://wordpress.org/support/plugin/custom-permalinks/) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The custom permalink you set and the URL you requested help a lot.
      placeholder: |
        1. Set the custom permalink of a post to `news/my-post/`.
        2. Visit `https://example.com/news/my-post/`.
        3. See a 404 instead of the post.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Custom Permalinks version
      placeholder: '3.3.0'
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
      placeholder: '7.1.3'
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: '8.3'
    validations:
      required: true
  - type: dropdown
    id: multilingual
    attributes:
      label: Multilingual plugin
      options:
        - None
        - WPML
        - Polylang
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Other plugins and theme
      description: Plugins that change URLs or redirects (SEO, redirection, caching, page builders) are the most useful to list.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the problem still happens with the latest version of Custom Permalinks.
          required: true
        - label: This isn't a security vulnerability. Those are reported privately; see SECURITY.md.
          required: true
